<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="console-token" content="__CONSOLE_TOKEN__">
  <title>MOI RAG · API 控制台</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #687287;
      --paper: #f5f7fb;
      --panel: #ffffff;
      --line: #dce2ec;
      --rail: #25324a;
      --good: #228b69;
      --warn: #c4752b;
      --bad: #bc4c5c;
      --shadow: 0 16px 45px rgba(31, 45, 73, .10);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 4%, rgba(63,124,255,.10), transparent 28rem),
        linear-gradient(180deg, #eef2f8 0, var(--paper) 18rem);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
    }
    button, input { font: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(63,124,255,.35); outline-offset: 2px; }
    .shell { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 38px 0 64px; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; }
    .eyebrow { color: #526079; font: 700 12px/1.2 ui-monospace, SFMono-Regular, monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font: 650 clamp(34px, 5vw, 66px)/.98 "Avenir Next", sans-serif; letter-spacing: -.055em; }
    .lede { color: var(--muted); font-size: 16px; max-width: 720px; margin: 0; }
    .refresh { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 11px 18px; cursor: pointer; box-shadow: 0 5px 18px rgba(31,45,73,.06); }
    .refresh:hover { border-color: #9ca9bd; transform: translateY(-1px); }
    .bus { margin: 34px 0 28px; padding: 24px 28px; background: var(--rail); color: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .bus-head { display: flex; justify-content: space-between; gap: 20px; align-items: center; }
    .bus-title { font: 650 18px/1.2 ui-monospace, SFMono-Regular, monospace; }
    .bus-note { color: #b8c3d7; font-size: 13px; }
    .rail { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 28px; }
    .rail::before { content: ""; position: absolute; top: 11px; left: 8%; right: 8%; height: 2px; background: #55627a; }
    .station { position: relative; text-align: center; padding-top: 32px; color: #aebbd1; font: 650 12px/1.3 ui-monospace, SFMono-Regular, monospace; }
    .station::before { content: ""; position: absolute; z-index: 1; top: 3px; left: 50%; width: 16px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: #59657b; border: 3px solid var(--rail); box-shadow: 0 0 0 2px #59657b; }
    .station.on { color: white; }
    .station.on::before { background: #69ddb7; box-shadow: 0 0 0 2px #69ddb7, 0 0 20px rgba(105,221,183,.75); }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 22px; }
    .pill { background: #e8edf5; color: #536078; border-radius: 999px; padding: 7px 11px; font-size: 12px; font-weight: 700; }
    .pill.good { background: #dff4ec; color: #176c52; }
    .pill.bad { background: #f8e5e8; color: #9d3445; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .card { --accent: #3f7cff; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 32px rgba(31,45,73,.07); overflow: hidden; }
    .card-head { display: flex; justify-content: space-between; gap: 18px; padding: 22px 24px 18px; border-top: 5px solid var(--accent); }
    .name { margin: 0; font-size: 25px; letter-spacing: -.035em; }
    .system { color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, monospace; }
    .state { display: inline-flex; gap: 7px; align-items: center; font-size: 12px; font-weight: 750; white-space: nowrap; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #a7b0bf; }
    .state.running .dot { background: var(--good); box-shadow: 0 0 0 4px rgba(34,139,105,.12); }
    .card-body { padding: 0 24px 24px; }
    .readiness { padding: 12px 14px; background: #f3f5f9; border-radius: 12px; color: #556078; font-size: 13px; line-height: 1.55; }
    .readiness strong { color: var(--ink); margin-right: 6px; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
    .datum { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; min-width: 0; }
    .datum span { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .datum b { display: block; margin-top: 4px; font: 650 12px/1.35 ui-monospace, SFMono-Regular, monospace; overflow: hidden; text-overflow: ellipsis; }
    .fields { display: grid; gap: 11px; margin-top: 17px; }
    .field label { display: flex; justify-content: space-between; gap: 10px; color: #49556b; font-size: 12px; font-weight: 700; margin: 0 2px 6px; }
    .configured { color: var(--good); font: 700 10px/1 ui-monospace, SFMono-Regular, monospace; }
    .missing { color: var(--bad); font: 700 10px/1 ui-monospace, SFMono-Regular, monospace; }
    .field input { width: 100%; border: 1px solid var(--line); background: #fafbfd; border-radius: 10px; padding: 10px 11px; color: var(--ink); }
    .field input::placeholder { color: #a0a9b7; }
    .hint { color: #7b8494; font-size: 11px; margin-top: 5px; }
    .actions { display: flex; gap: 9px; margin-top: 18px; flex-wrap: wrap; }
    .action { border: 0; border-radius: 10px; padding: 10px 13px; cursor: pointer; font-size: 12px; font-weight: 750; }
    .action.primary { background: var(--accent); color: white; }
    .action.secondary { background: #edf1f7; color: #425069; }
    .action.danger { background: #fae8ea; color: #a43c4d; }
    .action:disabled { opacity: .42; cursor: not-allowed; }
    .probe { margin-left: auto; }
    .toast { position: fixed; right: 24px; bottom: 24px; max-width: 420px; padding: 14px 17px; border-radius: 12px; background: var(--rail); color: white; box-shadow: var(--shadow); opacity: 0; transform: translateY(12px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    footer { color: #737d8f; margin-top: 30px; font-size: 12px; display: flex; justify-content: space-between; gap: 20px; }
    footer code { font-family: ui-monospace, SFMono-Regular, monospace; }
    @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } header { grid-template-columns: 1fr; } .refresh { justify-self: start; } }
    @media (max-width: 560px) { .shell { width: min(100% - 22px, 1440px); padding-top: 22px; } .bus { padding: 20px 16px; } .bus-head { align-items: flex-start; flex-direction: column; } .station { font-size: 10px; } .card-head, .card-body { padding-left: 17px; padding-right: 17px; } .meta { grid-template-columns: 1fr; } footer { flex-direction: column; } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">MOI benchmark / local control plane</div>
        <h1>RAG API 控制台</h1>
        <p class="lede">管理本地 MOI 与竞品服务的 API 配置。密钥只写入受限权限文件，页面永不回显已保存的 secret。</p>
      </div>
      <button class="refresh" onclick="loadStatus(true)">刷新并探测</button>
    </header>

    <section class="bus">
      <div class="bus-head">
        <div class="bus-title">SERIAL SERVICE BUS</div>
        <div class="bus-note" id="bus-note">正在读取 Docker 状态…</div>
      </div>
      <div class="rail" id="rail"></div>
    </section>

    <div class="summary" id="summary"></div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <footer>
      <span>仅绑定 <code>127.0.0.1</code> · Swagger: <a href="/docs">/docs</a></span>
      <span>运行数据：<code>.local-services/api-console/</code></span>
    </footer>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const token = document.querySelector('meta[name="console-token"]').content;
    const $ = (s) => document.querySelector(s);
    const esc = (s='') => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    let state = null;

    function toast(message) {
      const el = $('#toast'); el.textContent = message; el.classList.add('show');
      clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function badge(item) {
      const map = {near_ready: '接近可评估', partial: '部分就绪', blocked: '本机阻塞'};
      return map[item.readiness] || item.readiness;
    }

    function render(data) {
      state = data;
      const active = data.console.active_competitors;
      $('#bus-note').textContent = active.length ? `当前活动：${active.join(', ')}` : '当前没有竞品服务运行；启动时自动执行串行互斥。';
      $('#rail').innerHTML = data.platforms.map(p => `<div class="station ${p.running ? 'on' : ''}">${esc(p.name)}${p.serial_exempt ? '<br><small>BASELINE</small>' : ''}</div>`).join('');
      $('#summary').innerHTML = `
        <span class="pill ${data.console.serial_policy_ok ? 'good' : 'bad'}">串行策略 ${data.console.serial_policy_ok ? '正常' : '冲突'}</span>
        <span class="pill">${active.length} 个竞品运行中</span>
        <span class="pill">MOI baseline 独立运行</span>
        <span class="pill">密钥不回显</span>`;
      $('#grid').innerHTML = data.platforms.map(card).join('');
    }

    function card(p) {
      const probe = p.probe ? (p.probe.reachable ? `HTTP ${p.probe.status} · ${p.probe.latency_ms}ms` : '不可达') : '未探测';
      const fields = p.fields.map(f => `
        <div class="field">
          <label for="${esc(p.system_id)}-${esc(f.key)}"><span>${esc(f.label)}</span><span class="${f.configured ? 'configured' : 'missing'}">${f.configured ? 'CONFIGURED' : 'MISSING'}</span></label>
          <input id="${esc(p.system_id)}-${esc(f.key)}" data-key="${esc(f.key)}" type="${f.secret ? 'password' : 'text'}"
            value="${f.secret ? '' : esc(f.value)}" placeholder="${f.secret && f.configured ? '已保存；留空保持不变' : esc(f.default || '尚未配置')}" autocomplete="off">
          ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
        </div>`).join('');
      return `<article class="card" id="card-${esc(p.system_id)}" style="--accent:${esc(p.accent)}">
        <div class="card-head">
          <div><h2 class="name">${esc(p.name)}</h2><div class="system">${esc(p.system_id)}</div></div>
          <div class="state ${p.running ? 'running' : ''}"><span class="dot"></span>${p.running ? 'RUNNING' : 'STOPPED'}</div>
        </div>
        <div class="card-body">
          <div class="readiness"><strong>${esc(badge(p))}</strong>${esc(p.readiness_note)}</div>
          <div class="meta">
            <div class="datum"><span>API</span><b>${esc(p.base_url)}</b></div>
            <div class="datum"><span>Health</span><b>${esc(probe)}</b></div>
            <div class="datum"><span>Config</span><b>${p.configured_count}/${p.field_count} fields</b></div>
            <div class="datum"><span>Runtime file</span><b>${esc(p.config_file)}</b></div>
          </div>
          <div class="fields">${fields}</div>
          <div class="actions">
            <button class="action primary" onclick="saveConfig('${esc(p.system_id)}')">保存配置</button>
            <button class="action secondary" ${p.running || !p.start_allowed ? 'disabled' : ''} onclick="service('${esc(p.system_id)}','start')">启动服务</button>
            <button class="action danger" ${!p.running ? 'disabled' : ''} onclick="service('${esc(p.system_id)}','stop')">停止服务</button>
            <button class="action secondary probe" onclick="loadStatus(true)">健康检查</button>
          </div>
          ${p.start_blocked_reason ? `<div class="hint">启动已禁用：${esc(p.start_blocked_reason)}</div>` : ''}
        </div>
      </article>`;
    }

    async function loadStatus(probe=false) {
      try {
        const response = await fetch(`/api/status?probe_services=${probe}`);
        if (!response.ok) throw new Error(await response.text());
        render(await response.json());
      } catch (error) { toast(`读取状态失败：${error.message}`); }
    }

    async function saveConfig(systemId) {
      const values = {};
      document.querySelectorAll(`#card-${systemId} input[data-key]`).forEach(input => { if (input.value.trim()) values[input.dataset.key] = input.value.trim(); });
      try {
        const response = await fetch(`/api/config/${systemId}`, {method:'PUT', headers:{'Content-Type':'application/json','X-Console-Token':token}, body:JSON.stringify({values})});
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || '保存失败');
        toast(`${systemId} 配置已保存`); await loadStatus(false);
      } catch (error) { toast(error.message); }
    }

    async function service(systemId, action) {
      try {
        toast(`${action === 'start' ? '正在启动' : '正在停止'} ${systemId}…`);
        const response = await fetch(`/api/service/${systemId}`, {method:'POST', headers:{'Content-Type':'application/json','X-Console-Token':token}, body:JSON.stringify({action})});
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || '操作失败');
        toast(`${systemId} 已${action === 'start' ? '启动' : '停止'}`); await loadStatus(true);
      } catch (error) { toast(error.message); }
    }

    loadStatus(false);
    setInterval(() => loadStatus(false), 15000);
  </script>
</body>
</html>
