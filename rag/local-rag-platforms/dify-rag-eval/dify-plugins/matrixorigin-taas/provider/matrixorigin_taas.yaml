provider: matrixorigin_taas
label:
  en_US: MatrixOrigin TaaS
  zh_Hans: MatrixOrigin TaaS
description:
  en_US: MatrixOrigin TaaS chat, embedding, and rerank models.
  zh_Hans: MatrixOrigin TaaS 对话、嵌入与重排模型。
icon_small:
  en_US: icon.svg
  zh_Hans: icon.svg
icon_large:
  en_US: icon.svg
  zh_Hans: icon.svg
background: "#ECFEFF"
help:
  title:
    en_US: MatrixOrigin TaaS documentation
    zh_Hans: MatrixOrigin TaaS 文档
  url:
    en_US: https://taas.moi.matrixorigin.cn/taas/docs
    zh_Hans: https://taas.moi.matrixorigin.cn/taas/docs
supported_model_types:
  - llm
  - text-embedding
  - rerank
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your TaaS API key
        zh_Hans: 输入 TaaS API Key
    - variable: base_url
      label:
        en_US: Base URL
        zh_Hans: Base URL
      type: text-input
      required: true
      default: https://token.moi.matrixorigin.cn/v1
      placeholder:
        en_US: https://token.moi.matrixorigin.cn/v1
        zh_Hans: https://token.moi.matrixorigin.cn/v1
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter the TaaS endpoint model name
      zh_Hans: 输入 TaaS endpoint 中的模型名称
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your TaaS API key
        zh_Hans: 输入 TaaS API Key
    - variable: base_url
      label:
        en_US: Base URL
        zh_Hans: Base URL
      type: text-input
      required: true
      default: https://token.moi.matrixorigin.cn/v1
    - variable: context_size
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      type: text-input
      required: true
      default: "8192"
    - variable: vision_support
      label:
        en_US: Vision support
        zh_Hans: 视觉支持
      type: select
      required: true
      default: no_support
      options:
        - label:
            en_US: Not supported
            zh_Hans: 不支持
          value: no_support
        - label:
            en_US: Supported
            zh_Hans: 支持
          value: support
models:
  llm:
    predefined:
      - models/llm/*.yaml
    position: models/llm/_position.yaml
  text_embedding:
    predefined:
      - models/text_embedding/*.yaml
    position: models/text_embedding/_position.yaml
  rerank:
    predefined:
      - models/rerank/*.yaml
    position: models/rerank/_position.yaml
extra:
  python:
    provider_source: provider/matrixorigin_taas.py
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
      - models/rerank/rerank.py
