provider: huawei_maas
label:
  en_US: Huawei Cloud MaaS
  zh_Hans: 华为云 MaaS
description:
  en_US: Huawei Cloud MaaS chat, embedding, and rerank models.
  zh_Hans: 华为云 MaaS 对话、嵌入与重排模型。
icon_small:
  en_US: icon.svg
  zh_Hans: icon.svg
icon_large:
  en_US: icon.svg
  zh_Hans: icon.svg
background: "#CF0A2C"
help:
  title:
    en_US: Huawei Cloud MaaS API documentation
    zh_Hans: 华为云 MaaS API 文档
  url:
    en_US: https://support.huaweicloud.com/intl/en-us/api-maas/api-maas-0002.html
    zh_Hans: https://support.huaweicloud.com/api-maas/api-maas-0002.html
supported_model_types:
  - llm
  - text-embedding
  - rerank
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your Huawei Cloud MaaS API key
        zh_Hans: 输入华为云 MaaS API Key
    - variable: base_url
      label:
        en_US: Base URL
        zh_Hans: Base URL
      type: text-input
      required: true
      default: https://api.modelarts-maas.com/v1
      placeholder:
        en_US: https://api.modelarts-maas.com/v1
        zh_Hans: https://api.modelarts-maas.com/v1
model_credential_schema:
  model:
    label:
      en_US: Model Name
      zh_Hans: 模型名称
    placeholder:
      en_US: Enter the Huawei Cloud MaaS model parameter
      zh_Hans: 输入华为云 MaaS model 参数
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
    - variable: base_url
      label:
        en_US: Base URL
        zh_Hans: Base URL
      type: text-input
      required: true
      default: https://api.modelarts-maas.com/v1
    - variable: context_size
      label:
        en_US: Model context size
        zh_Hans: 模型上下文长度
      type: text-input
      required: true
      default: "8192"
    - variable: vision_support
      label:
        en_US: Vision support
        zh_Hans: 视觉支持
      type: select
      required: true
      default: no_support
      options:
        - label:
            en_US: Not supported
            zh_Hans: 不支持
          value: no_support
        - label:
            en_US: Supported
            zh_Hans: 支持
          value: support
models:
  llm:
    predefined:
      - models/huawei_llm/*.yaml
    position: models/huawei_llm/_position.yaml
  text_embedding:
    predefined:
      - models/huawei_text_embedding/*.yaml
    position: models/huawei_text_embedding/_position.yaml
  rerank:
    predefined:
      - models/huawei_rerank/*.yaml
    position: models/huawei_rerank/_position.yaml
extra:
  python:
    provider_source: provider/huawei_maas.py
    model_sources:
      - models/llm/llm.py
      - models/text_embedding/text_embedding.py
      - models/rerank/rerank.py
