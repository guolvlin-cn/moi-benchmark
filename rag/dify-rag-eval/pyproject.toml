[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dify-rag-eval"
version = "0.1.0"
description = "A small, reproducible evaluation harness for Dify RAG apps"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "MOI Benchmark"}]
dependencies = []

[project.scripts]
dify-rag-eval = "dify_rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

