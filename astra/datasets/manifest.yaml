    freeze_completed:
      - Exact repository commit, tree, source archive, 108-task snapshot, evaluator files, preprocess files, and ground-truth files are hashed.
      - The task image is pre-downloaded as a linux/amd64 OCI archive and verified in Docker by immutable registry digest.
      - All 17 declared auxiliary image references resolve to immutable linux/amd64 registry digests.
      - Docker runtime, dependency locks, MCP configuration sources, deployment sources, and local-tool implementations are hashed.
      - Astra and Hermes product artifacts, runtime environments, model contract, Adapter contract, budgets, permissions, and state policy are content-addressed by section 3.3.
      - The minimal M0 host and experiment roots are qualified and m0.sha256 verifies all four authority roots.
    m1_live_blockers:
      - Provision isolated disposable accounts and freeze non-secret account identifiers, permission scopes, provider/API versions, rate limits, and collection dates.
      - Provision every application baseline snapshot and prove deterministic reset replay.
      - Capture runtime list_tools output for every task and verify equivalent Astra/Hermes model-visible schemas and naming maps.
      - Freeze the task-scoped network allowlist, DNS, proxy, egress IP, TLS behavior, and service endpoint semantics.
      - Gold-replay evaluators and complete equivalent Astra/Hermes decoupled-agent adapter smoke tests.
    release_blockers:
      - Resolve repository/task license and redistribution terms before packaging the benchmark into a released MOI artifact.
    notes:
      - Toolathlon-Verified is a live multi-application evaluation environment, not a self-contained offline dataset.
      - The public trajectory dataset is reference data and is not required to execute the benchmark.
      - The official result is binary per task; partial completion and failure attribution require separate trajectory and evaluator diagnostics.
      - The frozen execution plan uses 14 non-scoring smoke tasks and one scored run per system on all 108 tasks; it does not report Pass@3 or Pass³.
      - Do not send production API keys through the public evaluation service; prefer a self-hosted service or an encrypted tunnel.

