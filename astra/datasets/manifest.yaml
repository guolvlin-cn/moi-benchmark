note: Audited means a first-pass availability and validity review, not benchmark readiness. Toolathlon-Verified has passed its minimal M0 freeze, but no candidate may enter smoke or scored runs until the benchmark-specific M1 live blockers are closed and their immutable evidence root is recorded.
