jobs_dir: "/Users/chenyuwei/Documents/MOI benchmark/work/astra-smoke-jobs"
n_concurrent_trials: 1
environment:
  type: docker
agents:
  - name: astra.runners.astra_smoke.agent:AstraSmokeAgent
    env:
      ASTRA_API_URL: ${ASTRA_API_URL}
      ASTRA_ACCESS_TOKEN: ${ASTRA_ACCESS_TOKEN}
      ASTRA_SMOKE_LINUX_BINARY: ${ASTRA_SMOKE_LINUX_BINARY}
      ASTRA_SMOKE_MODEL: ${ASTRA_SMOKE_MODEL}
    kwargs:
      condition: C0
      trigger_path: /tmp/astra-smoke/trigger
      trigger_timeout_sec: 60
      max_turns: 20
      turn_timeout_sec: 240
datasets:
  - path: "/Users/chenyuwei/Documents/MOI benchmark/astra/runners/astra_smoke/tasks"
    task_names:
      - astra-lifecycle-smoke
