  benchmark_id: enron_golden50_v1
  question_count: 50
  protocol: one isolated fixed-knowledge session per question; one attempt
  baseline_run: results/baseline_no_semantic/run.json
  semantic_run: results/with_semantic/run.json
  semantic_config: semantic/moi_email_qa_semantic_config.json

provenance_notes:
  - The Matrixflow source tree is linked by repository, branch, and commit instead of being copied here.
  - The evaluated local Matrixflow checkout contained uncommitted local changes; see README.md.
  - Login credentials, cookies, tokens, and raw database data are intentionally excluded.
